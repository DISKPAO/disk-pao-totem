
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>DISK PÃO - TOTEM DE PONTO</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f4f4f4;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .totem {
      width: 100%;
      max-width: 650px;
      min-height: 100vh;
      background: white;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .logo {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .titulo {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    #leitor {
      width: 100%;
      max-width: 420px;
      min-height: 280px;
      margin: 0 auto 25px auto;
      overflow: hidden;
    }

    #leitor video {
      width: 100% !important;
      height: auto !important;
      object-fit: cover;
    }

    .status {
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0;
      min-height: 30px;
    }

    .funcionario {
      display: none;
      background: #f1f1f1;
      border-radius: 15px;
      padding: 25px;
      margin-top: 15px;
    }

    .nome {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .matricula {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .tipo-jornada {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #444;
    }

    .botoes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      padding: 18px 10px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .botao-entrada {
      background: #168000;
      color: white;
    }

    .botao-saida-almoco {
      background: #b7791f;
      color: white;
    }

    .botao-volta-almoco {
      background: #2563a6;
      color: white;
    }

    .botao-saida {
      background: #b00020;
      color: white;
    }

    .instrucao {
      font-size: 18px;
      margin-top: 20px;
    }

    .erro {
      color: #b00020;
    }

    .sucesso {
      color: #168000;
    }

    @media (max-width: 480px) {
      .totem {
        padding: 20px 15px;
      }

      .logo {
        font-size: 32px;
      }

      .titulo {
        font-size: 23px;
      }

      #leitor {
        min-height: 250px;
      }

      .nome {
        font-size: 24px;
      }

      button {
        font-size: 15px;
        padding: 16px 6px;
      }
    }
  </style>
</head>

<body>

  <div class="totem">

    <div class="logo">
      DISK PÃO
    </div>

    <div class="titulo">
      TOTEM DE PONTO
    </div>

    <div id="leitor"></div>

    <div id="status" class="status">
      Preparando a câmera...
    </div>

    <div id="funcionario" class="funcionario">

      <div id="nome" class="nome"></div>

      <div id="matricula" class="matricula"></div>

      <div id="tipoJornada" class="tipo-jornada"></div>

      <div class="instrucao">
        Selecione o tipo de registro
      </div>

      <div class="botoes">

        <button
          class="botao-entrada"
          data-tipo="ENTRADA"
          onclick="registrar('ENTRADA')">
          ENTRADA
        </button>

        <button
          class="botao-saida-almoco"
          data-tipo="SAIDA ALMOCO"
          onclick="registrar('SAIDA ALMOCO')">
          SAÍDA ALMOÇO
        </button>

        <button
          class="botao-volta-almoco"
          data-tipo="VOLTA ALMOCO"
          onclick="registrar('VOLTA ALMOCO')">
          VOLTA ALMOÇO
        </button>

        <button
          class="botao-saida"
          data-tipo="SAIDA"
          onclick="registrar('SAIDA')">
          SAÍDA
        </button>

      </div>
    </div>
  </div>

  <script>

    // =====================================================
    // URL OFICIAL DO APPS SCRIPT
    // =====================================================

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbyA42Y2TOYFqzUviWMbOPXsk_Mu4hYFP-qKJWgxbEo-E8FQeyrGLxAJDaFXXc5hhIUz/exec";


    let processando = false;
    let funcionarioAtual = null;
    let leitorQR = null;
    let cameraIniciada = false;


    // =====================================================
    // ATUALIZAR STATUS
    // =====================================================

    function atualizarStatus(mensagem, classe = "status") {

      const status = document.getElementById("status");

      status.className = classe;
      status.innerText = mensagem;

    }


    // =====================================================
    // ENVIAR DADOS PARA O APPS SCRIPT
    // =====================================================

    async function enviarParaAppsScript(dados) {

      const resposta = await fetch(URL_APPS_SCRIPT, {

        method: "POST",

        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },

        body: JSON.stringify(dados)

      });

      if (!resposta.ok) {

        throw new Error(
          "Falha de comunicação com o servidor. Código: " +
          resposta.status
        );

      }

      return await resposta.json();

    }


    // =====================================================
    // QR CODE LIDO
    // =====================================================

    async function qrCodeLido(codigo) {

      if (processando) {
        return;
      }

      processando = true;

      atualizarStatus("Identificando funcionário...");

      try {

        const resultado = await enviarParaAppsScript({

          acao: "identificar",

          codigoQR: codigo

        });

        mostrarFuncionario(resultado);

      } catch (erro) {

        mostrarErro(erro);

      }

    }


    // =====================================================
    // CONFIGURAR BOTÕES CONFORME A JORNADA
    // =====================================================

    function configurarBotoesJornada(tipoJornada) {

      const tipo = String(
        tipoJornada || "NORMAL"
      ).trim().toUpperCase();

      const jornadaSemIntervalo =
        tipo === "SEM_INTERVALO" ||
        tipo === "HORA CORRIDA" ||
        tipo === "HORA_CORRIDA";

      const botoes = document.querySelectorAll(
        ".botoes button"
      );

      botoes.forEach(function(botao) {

        const tipoBotao = botao.dataset.tipo;

        const ehBotaoAlmoco =
          tipoBotao === "SAIDA ALMOCO" ||
          tipoBotao === "VOLTA ALMOCO";

        botao.style.display =
          jornadaSemIntervalo && ehBotaoAlmoco
            ? "none"
            : "block";

        botao.disabled = false;

      });

      const descricao =
        jornadaSemIntervalo
          ? "JORNADA SEM INTERVALO"
          : tipo === "FOLGA"
            ? "FOLGA"
            : "JORNADA NORMAL";

      document.getElementById("tipoJornada").innerText =
        descricao;

    }


    // =====================================================
    // MOSTRAR FUNCIONÁRIO
    // =====================================================

    function mostrarFuncionario(resultado) {

      if (!resultado || !resultado.encontrado) {

        funcionarioAtual = null;

        atualizarStatus(

          resultado && resultado.mensagem
            ? resultado.mensagem
            : "Funcionário não encontrado.",

          "status erro"

        );

        setTimeout(reiniciarLeitor, 3000);

        return;

      }

      funcionarioAtual = resultado;

      configurarBotoesJornada(
        resultado.tipoJornada
      );

      atualizarStatus(
        "Funcionário identificado",
        "status sucesso"
      );

      document.getElementById("nome").innerText =
        resultado.nome || "";

      document.getElementById("matricula").innerText =
        "Matrícula: " + (resultado.matricula || "");

      document.getElementById("funcionario").style.display =
        "block";

    }


    // =====================================================
    // REGISTRAR PONTO
    // =====================================================

    async function registrar(tipo) {

      if (!funcionarioAtual || processando === false) {
        return;
      }

      const tipoJornada = String(
        funcionarioAtual.tipoJornada || "NORMAL"
      ).trim().toUpperCase();

      const jornadaSemIntervalo =
        tipoJornada === "SEM_INTERVALO" ||
        tipoJornada === "HORA CORRIDA" ||
        tipoJornada === "HORA_CORRIDA";

      if (
        jornadaSemIntervalo &&
        (
          tipo === "SAIDA ALMOCO" ||
          tipo === "VOLTA ALMOCO"
        )
      ) {

        atualizarStatus(
          "Esta jornada não possui intervalo para almoço.",
          "status erro"
        );

        return;

      }

      const botoes = document.querySelectorAll(
        ".botoes button"
      );

      botoes.forEach(function(botao) {
        botao.disabled = true;
      });

      atualizarStatus("Registrando ponto...");

      try {

        const resultado = await enviarParaAppsScript({

          acao: "registrar",

          matricula: funcionarioAtual.matricula,

          nome: funcionarioAtual.nome,

          tipo: tipo

        });

        if (!resultado || !resultado.sucesso) {

          throw new Error(

            resultado && resultado.mensagem
              ? resultado.mensagem
              : "Não foi possível registrar o ponto."

          );

        }

        atualizarStatus(
          resultado.mensagem || "PONTO REGISTRADO COM SUCESSO",
          "status sucesso"
        );

        setTimeout(reiniciarLeitor, 2500);

      } catch (erro) {

        mostrarErro(erro);

        botoes.forEach(function(botao) {

          if (botao.style.display !== "none") {
            botao.disabled = false;
          }

        });

      }

    }


    // =====================================================
    // MOSTRAR ERRO
    // =====================================================

    function mostrarErro(erro) {

      const mensagem =
        erro && erro.message
          ? erro.message
          : String(erro);

      atualizarStatus(
        "Erro: " + mensagem,
        "status erro"
      );

      setTimeout(reiniciarLeitor, 4000);

    }


    // =====================================================
    // REINICIAR LEITOR
    // =====================================================

    function reiniciarLeitor() {

      processando = false;
      funcionarioAtual = null;

      document.getElementById("funcionario").style.display =
        "none";

      document.querySelectorAll(
        ".botoes button"
      ).forEach(function(botao) {

        botao.disabled = false;
        botao.style.display = "block";

      });

      atualizarStatus(
        cameraIniciada
          ? "Aponte a câmera frontal para o QR Code"
          : "Aguardando inicialização da câmera..."
      );

    }


    // =====================================================
    // INICIAR CÂMERA FRONTAL
    // =====================================================

    async function iniciarLeitor() {

      const elementoLeitor =
        document.getElementById("leitor");

      try {

        atualizarStatus("Preparando a câmera frontal...");

        let tentativas = 0;

        while (
          typeof Html5Qrcode === "undefined" &&
          tentativas < 30
        ) {

          await new Promise(function(resolve) {
            setTimeout(resolve, 200);
          });

          tentativas++;

        }

        if (typeof Html5Qrcode === "undefined") {

          throw new Error(
            "A biblioteca QR Code não carregou. Verifique a conexão com a internet."
          );

        }

        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {

          throw new Error(
            "O navegador não disponibilizou acesso à câmera. Abra o Totem pelo Chrome usando HTTPS."
          );

        }

        leitorQR = new Html5Qrcode("leitor");

        const configuracao = {

          fps: 10,

          qrbox: function(largura, altura) {

            const lado = Math.floor(
              Math.min(largura, altura) * 0.72
            );

            return {
              width: lado,
              height: lado
            };

          },

          aspectRatio: 1.0,

          disableFlip: false

        };


        // PRIMEIRA TENTATIVA: CÂMERA FRONTAL

        try {

          await leitorQR.start(

            { facingMode: "user" },

            configuracao,

            qrCodeLido,

            function() {
              // Ignora erros momentâneos de leitura.
            }

          );

        } catch (erroCameraFrontal) {

          // SEGUNDA TENTATIVA: LOCALIZAR CÂMERA FRONTAL

          const cameras = await Html5Qrcode.getCameras();

          if (!cameras || cameras.length === 0) {
            throw erroCameraFrontal;
          }

          const cameraFrontal = cameras.find(
            function(camera) {

              const nome = (
                camera.label || ""
              ).toLowerCase();

              return (
                nome.includes("front") ||
                nome.includes("user") ||
                nome.includes("selfie") ||
                nome.includes("frontal")
              );

            }
          );

          const cameraEscolhida = cameraFrontal
            ? cameraFrontal.id
            : cameras[0].id;

          await leitorQR.start(

            cameraEscolhida,

            configuracao,

            qrCodeLido,

            function() {
              // Ignora erros momentâneos de leitura.
            }

          );

        }

        cameraIniciada = true;

        atualizarStatus(
          "Aponte a câmera frontal para o QR Code"
        );

      } catch (erro) {

        cameraIniciada = false;

        console.error(
          "Erro ao iniciar câmera frontal:",
          erro
        );

        const mensagem = erro && erro.message
          ? erro.message
          : String(erro);

        atualizarStatus(

          "Não foi possível iniciar a câmera frontal: " +
          mensagem,

          "status erro"

        );

        elementoLeitor.innerHTML = "";

      }

    }


    // =====================================================
    // INICIAR SISTEMA
    // =====================================================

    window.addEventListener(
      "load",
      iniciarLeitor
    );

  </script>

</body>
</html>
